server {
    listen 80;
    server_name edusmart-prototype.example.edu;

    root /opt/edusmart/current/frontend/react-app/dist;
    index index.html;

    client_max_body_size 100m;

    location /assets/ {
        try_files $uri =404;
        access_log off;
        expires 7d;
    }

    location /notifications/stream/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    location ~ ^/(auth|chats|ai-query|ingest|courses|enrollments|offerings|roadmap-items|tasks|assessments|submissions|grading-templates|specs|notifications|health|db-health|test-llm|test-multi-query) {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
